name: Archive GitHub traffic

on:
  # Temporarily disabled from running on a daily schedule.
  # Run manually from the Actions tab if needed.
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: github-traffic-archive
  cancel-in-progress: false

jobs:
  archive:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Archive traffic
        env:
          TRAFFIC_TOKEN: ${{ secrets.TRAFFIC_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python .github/scripts/archive_github_traffic.py

      - name: Commit updated traffic history
        shell: bash
        run: |
          git add analytics/github-traffic

          if git diff --cached --quiet; then
            echo "No traffic changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git commit -m "chore: archive GitHub traffic"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
