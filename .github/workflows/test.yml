name: Quality checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: .github/quality/requirements.txt

      - name: Install quality tools
        run: python -m pip install -r .github/quality/requirements.txt

      - name: Check test formatting
        run: python -m black --config .github/quality/pyproject.toml --check .github/quality/tests

      - name: Run lint checks
        run: python -m flake8 --config .github/quality/.flake8 .github/quality/tests

      - name: Run repository-quality tests
        run: python -m pytest -c .github/quality/pyproject.toml .github/quality/tests
