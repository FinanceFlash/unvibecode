<title id="t">Before and after UnvibeCode</title><desc id="d">Full code dumps into an LLM compared with AST and code graph, graph-aware context, and evidence-gated findings.</desc>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#182438}.big{font-size:30px;font-weight:800}.head{font-size:25px;font-weight:800}.label{font-size:19px;font-weight:700}.sub{font-size:17px;fill:#475569}.item{font-size:17px}.pill{font-size:16px;font-weight:800}</style>
<rect width="1400" height="735" rx="14" fill="white"/>
<text x="700" y="47" text-anchor="middle" class="big">Why not just dump your entire codebase into an LLM?</text><text x="700" y="79" text-anchor="middle" font-size="18" fill="#52617a">More source code doesn't automatically mean better code understanding.</text>
